<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVidEditor - AI Video Generator</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #334155, #0f172a);
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        input[type="file"]:hover {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #result {
            margin-top: 32px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            outline: none;
            background: black;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #818cf8;
            font-weight: 500;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AutoVidEditor</h1>
    <p class="subtitle">AI Automated Timeline & Video Generator</p>

    <form id="uploadForm">
        <div class="form-group">
            <label for="images">1. Upload Images (in order)</label>
            <input type="file" id="images" name="images" accept="image/*" multiple required>
        </div>
        <div class="form-group">
            <label for="audio">2. Upload Voiceover (Audio)</label>
            <input type="file" id="audio" name="audio" accept="audio/*" required>
        </div>
        <button type="submit" id="generateBtn">Generate Video</button>
    </form>

    <div class="loading" id="loadingDiv">
        <div class="spinner"></div> Generating your video... this might take a minute.
    </div>

    <div id="result">
        <h3>Your Final Video is Ready!</h3>
        <video id="videoPlayer" controls></video>
        <br><br>
        <a id="downloadLink" href="#" download style="color: #818cf8; text-decoration: none; font-weight: bold;">Download Video</a>
    </div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const generateBtn = document.getElementById('generateBtn');
        const loadingDiv = document.getElementById('loadingDiv');
        const resultDiv = document.getElementById('result');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadLink = document.getElementById('downloadLink');

        generateBtn.disabled = true;
        loadingDiv.style.display = 'block';
        resultDiv.style.display = 'none';

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                videoPlayer.src = data.video_url;
                downloadLink.href = data.video_url;
                resultDiv.style.display = 'block';
            } else {
                alert('Error: ' + (data.error || 'Unknown error occurred.'));
            }
        } catch (err) {
            alert('Request failed: ' + err.message);
        } finally {
            generateBtn.disabled = false;
            loadingDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
